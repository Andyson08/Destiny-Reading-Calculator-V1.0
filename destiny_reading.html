// ---- Helpers ---------------------------------------------------------------

function tenGod(dayStem, otherStem) {
  if (!dayStem || !otherStem || !STEM_EL[otherStem]) return "";
  const de = STEM_EL[dayStem],
    oe = STEM_EL[otherStem];
  const same = STEM_YY[dayStem] === STEM_YY[otherStem];
  const GEN = {
    木: "火",
    火: "土",
    土: "金",
    金: "水",
    水: "木"
  };
  const KE = {
    木: "土",
    土: "水",
    水: "火",
    火: "金",
    金: "木"
  };
  if (de === oe) return same ? "比肩" : "劫财";
  if (GEN[de] === oe) return same ? "食神" : "伤官";
  if (KE[de] === oe) return same ? "偏财" : "正财";
  if (KE[oe] === de) return same ? "七杀" : "正官";
  if (GEN[oe] === de) return same ? "偏印" : "正印";
  return "";
}
function yinYangGender(gender, yearStem) {
  return (STEM_YY[yearStem] || "阳") + gender;
}
function collectMutagens(palaces) {
  const out = [];
  palaces.forEach(p => {
    [...(p.major_stars || []), ...(p.minor_stars || [])].forEach(s => {
      if (s.mutagen) out.push({
        star: s.name,
        mutagen: s.mutagen,
        branch: p.earthly_branch
      });
    });
  });
  const order = {
    禄: 0,
    权: 1,
    科: 2,
    忌: 3
  };
  out.sort((a, b) => order[a.mutagen] - order[b.mutagen]);
  return out;
}

function normalisePalaceName(n) {
  return PALACE_NAME_ALIASES[n] || n;

function palaceByName(palaces, name) {
  return palaces.find(p => normalisePalaceName(p.name) === name);

function hourRangeStr(timeStr) {
  if (!timeStr) return "";
  const h = parseInt(String(timeStr).split(":")[0], 10);
  if (isNaN(h)) return "";
  let start, end;
  if (h === 23 || h === 0) {
    start = 23;
    end = 1;
  } else {
    const block = Math.floor((h + 1) / 2);
    start = block * 2 - 1;
    end = block * 2 + 1;
  }
  const fmt = x => String((x % 24 + 24) % 24).padStart(2, "0") + ":00";
  return "(" + fmt(start) + "-" + fmt(end) + ")";
}
function dobDDMMYYYY(dob) {
  if (!dob) return "";
  const m = String(dob).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + "/" + m[2] + "/" + m[1] : dob;
}
function baziStr(bz) {
  if (!bz || !bz.pillars) return "";

function starWithMark(s, school) {
  const b = school === "sanhe" && s.brightness_sanhe ? s.brightness_sanhe : s.brightness || "";

function palaceLine(p, school) {
  if (!p) return "";
  const baseName = normalisePalaceName(p.name);
  const title = p.is_body_palace ? baseName + "/身宫" : baseName;
  const majors = (p.major_stars || []).map(s => starWithMark(s, school));
  const minors = (p.minor_stars || []).map(s => starWithMark(s, school));
  const adjs = (p.adjective_stars || []).map(s => s.name);
  const stages = [p.changsheng12, p.boshi12, p.jiangqian12, p.suiqian12].filter(Boolean);
  const parts = [];
  if (majors.length) parts.push(majors.join("，"));
  if (minors.length) parts.push(minors.join("，"));
  const tail = [...adjs, ...stages];
  if (tail.length) parts.push(tail.join(","));
  return title + "（" + p.heavenly_stem + p.earthly_branch + "）：" + parts.join("，");
}
function buildExportText(person, school) {

  return out.join("\n");
}
function downloadText(filename, text) {
  try {
    const blob = new Blob([text], {
      type: "text/plain;charset=utf-8"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.error("Export failed:", e);
  }
}

// 太阳/太阴 day-night modifier — ported from destiny_engine.py.
function sunMoonDayNight(hour) {
  const isDay = hour >= 5 && hour < 17;
  const sunPeak = hour >= 11 && hour < 13;
  const moonPeak = hour >= 23 || hour < 1;
  const sunState = isDay ? sunPeak ? "增辉·峰" : "增辉" : "失辉";
  const moonState = isDay ? "失辉" : moonPeak ? "增辉·峰" : "增辉";
  const period = isDay ? "日" : "夜";
  const strong = isDay ? "太阳" : "太阴";
  const weak = isDay ? "太阴" : "太阳";
  const hh = String(hour).padStart(2, "0");
  return {
    hour,
    period,
    sun_state: sunState,
    moon_state: moonState,
    note: "生于" + period + "间（" + hh + "时），" + strong + "增辉，" + weak + "失辉。"
  };
}

// iztro time-index convention:
//   0 早子时 00:00-01:00, 1 丑, 2 寅, … 11 亥 21:00-23:00, 12 晚子时 23:00-24:00
function hhmmToTimeIndex(hhmm) {
  const [hhS, mmS] = String(hhmm || "12:00").split(":");
  const h = parseInt(hhS, 10) + (parseInt(mmS, 10) || 0) / 60;
  if (h < 1) return 0;
  if (h >= 23) return 12;
  return Math.floor((h + 1) / 2);
}

}

function convertIztroPalace(p) {

    major_stars: majors,
    minor_stars: (p.minorStars || []).map(s => Object.assign({}, s)),
    adjective_stars: (p.adjectiveStars || []).map(s => Object.assign({}, s)),

    suiqian12: p.suiqian12 || "",
    decadal: p.decadal ? {

function buildBaziClient(y, m, d, hh, mm, genderZh) {
